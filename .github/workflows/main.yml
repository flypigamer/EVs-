name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-pip zip unzip openjdk-17-jdk
          pip3 install buildozer

      - name: Build with Buildozer
        run: |
          # Hum Buildozer ko bolenge ki wo khud SDK manage kare 
          # aur hum manually koi path nahi chedenge
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: discord-gen-apk
          path: bin/*.apk
